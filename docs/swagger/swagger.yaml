definitions:
  dto.AgentInfoRequest:
    properties:
      name:
        description: Название агента (в разработке)
        type: string
      printers:
        description: Список принтеров
        items:
          $ref: '#/definitions/dto.PrinterInfo'
        type: array
      version:
        description: Версия агента (в разработке)
        type: string
    type: object
  dto.DecodeRequest:
    properties:
      code:
        description: Данные от сканера
        type: string
    type: object
  dto.DecodeResponse:
    properties:
      id:
        description: ID данных, если имеются
        type: integer
      type:
        description: Тип данных
        type: integer
    type: object
  dto.DispatchContainerRequest:
    properties:
      container_id:
        type: integer
      from:
        $ref: '#/definitions/dto.LocationDTO'
    type: object
  dto.DispatchItemRequest:
    properties:
      from:
        $ref: '#/definitions/dto.LocationDTO'
      item_id:
        type: integer
      quantity:
        type: integer
    type: object
  dto.EntityTypeId:
    enum:
    - 1
    - 2
    - 3
    type: integer
    x-enum-comments:
      EntityTypeIdContainer: Контейнеры
      EntityTypeIdProduct: Товары
      EntityTypeIdTypeCell: Ячейки
    x-enum-descriptions:
    - Товары
    - Контейнеры
    - Ячейки
    x-enum-varnames:
    - EntityTypeIdProduct
    - EntityTypeIdContainer
    - EntityTypeIdTypeCell
  dto.GetPrintTaskResponse:
    properties:
      data:
        description: RAW (base64) данные для печати
        type: string
      entity_id:
        description: ID данных
        type: integer
      entity_type_id:
        allOf:
        - $ref: '#/definitions/dto.EntityTypeId'
        description: ID типа данных
      id:
        description: ID задачи
        type: integer
      labels:
        additionalProperties:
          type: string
        description: Типовые метки
        type: object
      printer_name:
        description: Название принтера, на который надо печатать
        type: string
      to_file:
        description: Печать в файл (в разработке)
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/dto.PrintTaskType'
        description: Тип задачи
    type: object
  dto.ItemResponse:
    properties:
      attributes:
        items:
          type: integer
        type: array
      barcode:
        type: string
      created_at:
        type: string
      id:
        type: integer
      manufacturer_id:
        type: integer
      manufacturer_name:
        type: string
      name:
        type: string
      sku:
        type: string
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  dto.ItemSuggest:
    properties:
      attributes:
        items:
          type: integer
        type: array
      barcode:
        type: string
      created_at:
        type: string
      id:
        type: integer
      manufacturer_id:
        type: integer
      manufacturer_name:
        type: string
      name:
        type: string
      sku:
        type: string
      tags:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  dto.LocationDTO:
    properties:
      cell_id:
        type: integer
      container_id:
        type: integer
      whs_id:
        type: integer
      zone_id:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      api_key:
        description: ApiKey, если авторизация не по паролю
        type: string
      email:
        description: Логин
        type: string
      password:
        description: Пароль
        type: string
    type: object
  dto.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.ManufacturerResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.ManufacturerSuggest:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  dto.MoveContainerRequest:
    properties:
      container_id:
        type: integer
      from:
        $ref: '#/definitions/dto.LocationDTO'
      to:
        $ref: '#/definitions/dto.LocationDTO'
    type: object
  dto.MoveItemRequest:
    properties:
      from:
        $ref: '#/definitions/dto.LocationDTO'
      item_id:
        type: integer
      quantity:
        type: integer
      to:
        $ref: '#/definitions/dto.LocationDTO'
    type: object
  dto.NestContainerRequest:
    properties:
      child_id:
        type: integer
      target_parent_id:
        type: integer
    type: object
  dto.PlaceContainerRequest:
    properties:
      container_id:
        type: integer
      to:
        $ref: '#/definitions/dto.LocationDTO'
    type: object
  dto.PrintTaskType:
    enum:
    - 1
    type: integer
    x-enum-comments:
      PrintTaskTypeLabel: Стандартная этикетка
    x-enum-descriptions:
    - Стандартная этикетка
    x-enum-varnames:
    - PrintTaskTypeLabel
  dto.PrinterInfo:
    properties:
      printer_name:
        description: Название принтера
        type: string
    type: object
  dto.ReceiveItemRequest:
    properties:
      item_id:
        type: integer
      quantity:
        type: integer
      to:
        $ref: '#/definitions/dto.LocationDTO'
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RefreshResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  dto.ResolveAction:
    enum:
    - FOUND
    - CLONED
    - CREATED
    type: string
    x-enum-varnames:
    - ActionFound
    - ActionCloned
    - ActionCreated
  dto.ResolveItemRequest:
    properties:
      attributes:
        items:
          type: integer
        type: array
      barcode:
        type: string
      base_id:
        type: integer
      manufacturer_id:
        type: integer
      name:
        type: string
      sku:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  dto.ResolveItemResponse:
    properties:
      action:
        $ref: '#/definitions/dto.ResolveAction'
      item:
        $ref: '#/definitions/dto.ItemResponse'
    type: object
  dto.ResolveManufacturerRequest:
    properties:
      base_id:
        type: integer
      name:
        type: string
    type: object
  dto.ResolveManufacturerResponse:
    properties:
      action:
        $ref: '#/definitions/dto.ResolveAction'
      manufacturer:
        $ref: '#/definitions/dto.ManufacturerResponse'
    type: object
  dto.StorageOperationResponse:
    properties:
      row_id:
        type: string
    type: object
  dto.TaskStatus:
    enum:
    - 0
    - 1
    - 11
    - 12
    type: integer
    x-enum-comments:
      PrintTaskStatusError: Завершилось с ошибкой
      PrintTaskStatusPending: Ожидание
      PrintTaskStatusProcessing: В обработке
      PrintTaskStatusSuccess: Завершилось успешно
    x-enum-descriptions:
    - Ожидание
    - В обработке
    - Завершилось успешно
    - Завершилось с ошибкой
    x-enum-varnames:
    - PrintTaskStatusPending
    - PrintTaskStatusProcessing
    - PrintTaskStatusSuccess
    - PrintTaskStatusError
  dto.UnnestContainerRequest:
    properties:
      container_id:
        type: integer
      to:
        $ref: '#/definitions/dto.LocationDTO'
    type: object
  dto.UpdateItemRequest:
    properties:
      attributes:
        items:
          type: integer
        type: array
      barcode:
        type: string
      manufacturer_id:
        type: integer
      name:
        type: string
      sku:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  dto.UpdateManufacturerRequest:
    properties:
      name:
        type: string
    type: object
  dto.UpdatePrintTaskStatusRequest:
    properties:
      id:
        type: integer
      status:
        $ref: '#/definitions/dto.TaskStatus'
    type: object
  wrapper.Data:
    properties:
      data: {}
    type: object
info:
  contact: {}
  title: Lynway WMS API
  version: "1.0"
paths:
  /auth/login:
    post:
      parameters:
      - description: логин/пароль пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      responses:
        "200":
          description: JWT токены
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.LoginResponse'
              type: object
      summary: вход в систему
      tags:
      - Authorization
  /auth/refresh:
    post:
      parameters:
      - description: refresh токен
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      responses:
        "200":
          description: JWT токены
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.RefreshResponse'
              type: object
      summary: обновление токенов
      tags:
      - Authorization
  /decode:
    post:
      parameters:
      - description: данные от сканера
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DecodeRequest'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.DecodeResponse'
              type: object
      summary: '"декодирует" данные от сканера, определяет штрих-код какой сущности
        был отсканированы'
      tags:
      - Wms
  /items/{id}:
    get:
      parameters:
      - description: идентификатор номенклатуры
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: элемент номенклатуры
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.ItemResponse'
              type: object
      summary: возвращает элемент номенклатуры
      tags:
      - Catalog
    patch:
      parameters:
      - description: идентификатор номенклатуры
        in: path
        name: id
        required: true
        type: integer
      - description: данные номенклатуры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateItemRequest'
      responses:
        "200":
          description: элемент номенклатуры
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.ItemResponse'
              type: object
      summary: обновляет элемент номенклатуры
      tags:
      - Catalog
  /items/resolve:
    post:
      description: |-
        **«FCC»**:
        - Передан `base_id` + ключевые поля (`name`, `sku`, `barcode`) **изменены** -> создает новый `Item`, наследуя `image_path`, `tags`, `attributes` из оригинала.
        - Передан `base_id` + ключевые поля **не изменены** -> возвращает оригинал.
      parameters:
      - description: данные производителя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResolveItemRequest'
      responses:
        "200":
          description: элемент производителя
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.ResolveItemResponse'
              type: object
      summary: обновляет или создает новый элемент номенклатуры
      tags:
      - Catalog
  /items/suggest:
    get:
      description: точное совпадение по `barcode`/`sku` или нечеткое по `name` и `tags`
        через `pg_trgm`)
      parameters:
      - description: поисковая строка
        in: query
        name: q
        required: true
        type: string
      - description: количество результатов, по-умолчанию 10
        in: query
        name: l
        type: integer
      responses:
        "200":
          description: список номенклатуры
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ItemSuggest'
                  type: array
              type: object
      summary: поиск номенклатуры для автокомплита
      tags:
      - Catalog
  /manufacturers/{id}:
    get:
      parameters:
      - description: идентификатор производителя
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: элемент производителя
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.ManufacturerResponse'
              type: object
      summary: возвращает элемент производителя
      tags:
      - Catalog
    patch:
      parameters:
      - description: идентификатор производителя
        in: path
        name: id
        required: true
        type: integer
      - description: данные производителя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateManufacturerRequest'
      responses:
        "200":
          description: элемент производителя
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.ManufacturerResponse'
              type: object
      summary: обновляет элемент производителя
      tags:
      - Catalog
  /manufacturers/resolve:
    post:
      description: |-
        **«FCC»**:
        - Передан `base_id` + ключевые поля (`name`) **изменены** -> создает новый `Manufacturer`.
        - Передан `base_id` + ключевые поля **не изменены** -> возвращает оригинал.
      parameters:
      - description: данные производителя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResolveManufacturerRequest'
      responses:
        "200":
          description: элемент производителя
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.ResolveManufacturerResponse'
              type: object
      summary: обновляет или создает новый элемент производителя
      tags:
      - Catalog
  /manufacturers/suggest:
    get:
      description: совпадение по `name`)
      parameters:
      - description: поисковая строка
        in: query
        name: q
        required: true
        type: string
      - description: количество результатов, по-умолчанию 10
        in: query
        name: l
        type: integer
      responses:
        "200":
          description: список производителей
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ManufacturerSuggest'
                  type: array
              type: object
      summary: поиск производителя для автокомплита
      tags:
      - Catalog
  /print/agents/sync:
    post:
      description: агент обновляет данные о себе на сервере и обновляет список принтеров
      parameters:
      - description: данные агента
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AgentInfoRequest'
      responses:
        "200":
          description: OK
      summary: обновление данных агента печати
      tags:
      - Printing
  /print/tasks:
    get:
      description: агент получает задание из очереди.
      responses:
        "200":
          description: задание для печати
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.GetPrintTaskResponse'
              type: object
      summary: получение задания на печать
      tags:
      - Printing
  /print/tasks/status:
    post:
      description: после выполнения печати, агент обновляет статус задания
      parameters:
      - description: новый статус задания
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePrintTaskStatusRequest'
      responses:
        "200":
          description: OK
      summary: обновление статуса задания печати на сервере
      tags:
      - Printing
  /storage/containers/dispatch:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры выбытия
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DispatchContainerRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: выбытие (отгрузка) внешнего контейнера в системную зону DISPATCH
      tags:
      - Storage
  /storage/containers/move:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры перемещения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MoveContainerRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: перемещение внешнего контейнера вместе с содержимым
      tags:
      - Storage
  /storage/containers/nest:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры вложения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.NestContainerRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: вложение одного контейнера внутрь другого
      tags:
      - Storage
  /storage/containers/place:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры размещения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PlaceContainerRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: первичное размещение внешнего контейнера в зону или ячейку
      tags:
      - Storage
  /storage/containers/unnest:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры извлечения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UnnestContainerRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: извлечение вложенного контейнера наружу
      tags:
      - Storage
  /storage/items/dispatch:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры выбытия
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.DispatchItemRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: выбытие (списание) товара в системную зону DISPATCH
      tags:
      - Storage
  /storage/items/move:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры перемещения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.MoveItemRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: перемещение товара между зонами, ячейками или контейнерами
      tags:
      - Storage
  /storage/items/receive:
    post:
      parameters:
      - description: ключ идемпотентности
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: параметры приемки
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReceiveItemRequest'
      responses:
        "200":
          description: результат операции
          schema:
            allOf:
            - $ref: '#/definitions/wrapper.Data'
            - properties:
                data:
                  $ref: '#/definitions/dto.StorageOperationResponse'
              type: object
      summary: приемка товара в зону, ячейку или контейнер
      tags:
      - Storage
swagger: "2.0"
